name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [bcrypter, scrypter, helloworld, jumin, jwter, timetool, portwho]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            ${{ matrix.module }}/go.mod
            ${{ matrix.module }}/go.sum
      - name: Verify issue reporting behavior
        if: matrix.module == 'bcrypter'
        working-directory: .
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_security_issue.py' -v
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check known vulnerabilities
        id: scan
        run: |
          set +e
          "$(go env GOPATH)/bin/govulncheck" -test -show verbose ./...
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
      - name: Fail for reachable vulnerabilities
        if: steps.scan.outputs.vulnerable == 'true'
        run: exit 1

  security-issue:
    name: Report scheduled security findings
    needs: govulncheck
    if: >-
      ${{ !cancelled() && github.event_name == 'schedule' &&
          github.ref == 'refs/heads/main' && needs.govulncheck.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: dependency-security-issue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Update issue and notify once per day
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/security_issue.py
