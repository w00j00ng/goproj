name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: dependency-scan (go/${{ matrix.module }}/${{ matrix.target.id }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [bcrypter, scrypter, helloworld, jumin, jwter, timetool, portwho]
        target:
          - id: linux-cgo0
            runner: ubuntu-24.04
            cgo: '0'
          - id: linux-cgo1
            runner: ubuntu-24.04
            cgo: '1'
          - id: windows-cgo0
            runner: windows-latest
            cgo: '0'
          - id: macos-cgo1
            runner: macos-latest
            cgo: '1'
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.module }}
    env:
      CGO_ENABLED: ${{ matrix.target.cgo }}
      SECURITY_SCAN_KEY: go-${{ matrix.module }}-${{ matrix.target.id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            ${{ matrix.module }}/go.mod
            ${{ matrix.module }}/go.sum
      - name: Prepare Linux clipboard headers
        if: matrix.target.id == 'linux-cgo1'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libx11-dev
      - name: Check scanner prerequisites
        run: |
          jq --version
          command -v mktemp
          command -v grep
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check known vulnerabilities
        id: scan
        working-directory: .
        env:
          SECURITY_RESULT_FILE: ${{ runner.temp }}/security-result.json
        run: task --exit-code security:scan MODULE=${{ matrix.module }}
      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-scan-${{ env.SECURITY_SCAN_KEY }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-result.json
          if-no-files-found: error
      - name: Fail for reachable vulnerabilities
        if: steps.scan.outputs.vulnerable == 'true'
        run: exit 1

  security-issue:
    name: Report scheduled security findings
    needs: govulncheck
    if: >-
      ${{ !cancelled() && github.event_name == 'schedule' &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: dependency-security-issue
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - name: Update issue and notify once per day
        env:
          GH_TOKEN: ${{ github.token }}
        run: task security:report
