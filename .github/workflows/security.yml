name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: dependency-scan (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [bcrypter, scrypter, helloworld, jumin, jwter, timetool, portwho]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            ${{ matrix.module }}/go.mod
            ${{ matrix.module }}/go.sum
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - name: Verify issue reporting behavior
        if: matrix.module == 'bcrypter'
        working-directory: .
        run: task security:test
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check known vulnerabilities
        id: scan
        working-directory: .
        run: task --exit-code security:scan MODULE=${{ matrix.module }}
      - name: Fail for reachable vulnerabilities
        if: steps.scan.outputs.vulnerable == 'true'
        run: exit 1

  security-issue:
    name: Report scheduled security findings
    needs: govulncheck
    if: >-
      ${{ !cancelled() && github.event_name == 'schedule' &&
          github.ref == 'refs/heads/main' && needs.govulncheck.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: dependency-security-issue
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - name: Update issue and notify once per day
        env:
          GH_TOKEN: ${{ github.token }}
        run: task security:report
