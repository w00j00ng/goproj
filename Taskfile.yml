version: '3'

set: [errexit, nounset, pipefail]
silent: true

vars:
  SECURITY_SCAN: |
    status=0
    govulncheck -test -show verbose ./... || status=$?
    if [ "$status" -eq 3 ] && [ -n "${GITHUB_OUTPUT:-}" ]; then
      printf 'vulnerable=true\n' >> "$GITHUB_OUTPUT"
    else
      exit "$status"
    fi

  SECURITY_REPORT: |
    if [ "${GITHUB_EVENT_NAME:-}" != schedule ] || [ "${GITHUB_REF:-}" != refs/heads/main ]; then
      exit 0
    fi
    api() {
      method=$1
      endpoint=$2
      shift 2
      gh api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$endpoint" \
        --method "$method" -H 'X-GitHub-Api-Version: 2026-03-10' "$@"
    }
    run=$(api GET "actions/runs/$GITHUB_RUN_ID")
    allowed=$(printf '%s' "$run" | jq -j '(.event == "schedule" and .head_branch == "main") | tostring')
    if [ "$allowed" != true ]; then
      exit 0
    fi
    jobs=$(api GET "actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate --slurp |
      jq '[.[].jobs[] | select((.name | startswith("govulncheck (")) and .status == "completed")]')
    findings=$(printf '%s' "$jobs" | jq '[.[] | select(.conclusion == "failure" and
      any(.steps[]?; .name == "Fail for reachable vulnerabilities" and .conclusion == "failure"))]')
    if [ "$(printf '%s' "$findings" | jq -j 'length | tostring')" -eq 0 ]; then
      exit 0
    fi
    run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
    scanned_at=$(printf '%s' "$run" | jq -j '.created_at | fromdateiso8601 + (9 * 3600) | strftime("%Y-%m-%d %H:%M")')
    day=${scanned_at%% *}
    sha=$(printf '%s' "$run" | jq -j .head_sha)
    marker='<!-- dependency-security-issue:v1 -->'
    body=$(printf '%s\n' "$marker" \
      'main 정기 의존성 검사에서 호출 가능한 보안 취약점이 발견되었습니다.' '' \
      "- 검사일: $scanned_at KST" "- 대상 커밋: \`$sha\`" "- 실행: [검사 로그]($run_url)" '' \
      '| 취약점 발견 모듈 | 상세 결과 |' '| --- | --- |'
      printf '%s' "$findings" | jq -r 'sort_by(.name)[] | "| \(.name) | [취약점 및 호출 경로](\(.html_url)) |"'
      errors=$(printf '%s' "$jobs" | jq -j --argjson findings "$findings" \
        '[.[] | select(.conclusion != "success" and (. as $job | $findings | index($job) | not)) | .name] | join(", ")')
      if [ -n "$errors" ]; then
        printf '\n다음 모듈은 검사 오류로 판정하지 못했습니다: %s.\n' "$errors"
      fi
      printf '\n%s\n%s\n' '검사 범위: Linux, CGO_ENABLED=0, 테스트 포함, govulncheck v1.9.0.' \
        '본문은 최근 발견 결과로 갱신하며 알림은 별도 댓글로 남깁니다. 조치 완료 후 이슈를 닫아 주세요. 이후 발견 시 새 이슈를 생성합니다.')
    number=$(api GET 'issues?state=open&creator=github-actions%5Bbot%5D' --paginate --slurp |
      jq -j --arg marker "$marker" '[.[][] | select(has("pull_request") | not) |
        select(.state == "open" and .user.login == "github-actions[bot]" and ((.body // "") | contains($marker)))][0].number // empty | tostring')
    if [ -n "$number" ]; then
      jq -n --arg body "$body" '{body: $body}' | api PATCH "issues/$number" --input - > /dev/null
    else
      issue=$(jq -n --arg body "$body" '{title: "의존성 보안 취약점 정기 검사", body: $body}' |
        api POST issues --input -)
      number=$(printf '%s' "$issue" | jq -je '.number | numbers | tostring')
    fi
    day_marker="<!-- dependency-security-alert:$day -->"
    comments=$(api GET "issues/$number/comments" --paginate --slurp)
    notified=$(printf '%s' "$comments" | jq -j --arg marker "$day_marker" \
      'any(.[][]; .user.login == "github-actions[bot]" and ((.body // "") | contains($marker))) | tostring')
    if [ "$notified" != true ]; then
      comment=$(printf '%s\n%s' "$day_marker" \
        "@w00j00ng $day KST 정기 검사에서 보안 취약점이 발견되었습니다. [검사 결과]($run_url)와 갱신된 본문을 확인해 주세요.")
      jq -n --arg body "$comment" '{body: $body}' | api POST "issues/$number/comments" --input - > /dev/null
    fi

tasks:
  security:scan:
    desc: Scan one module; mark confirmed CI findings or return the scanner exit code locally
    dir: '{{.MODULE}}'
    requires:
      vars:
        - name: MODULE
          enum: [bcrypter, scrypter, helloworld, jumin, jwter, timetool, portwho]
    env:
      CGO_ENABLED: '0'
    cmds:
      - '{{.SECURITY_SCAN}}'

  security:report:
    desc: Update the scheduled-main security issue and daily mention comment
    cmds:
      - '{{.SECURITY_REPORT}}'

  security:test:
    desc: Verify security reporting and scanner classification without GitHub access
    cmds:
      - |
        tmp=$(mktemp -d -p . .security-test.XXXXXXXX)
        fixture="$tmp/state.json"
        log="$tmp/log"
        trap 'rm -f "$fixture" "$log"; rmdir "$tmp"' EXIT
        export GITHUB_EVENT_NAME=schedule GITHUB_REF=refs/heads/main
        export GITHUB_API_URL=https://api.github.com GITHUB_SERVER_URL=https://github.com
        export GITHUB_REPOSITORY=w00j00ng/goproj GITHUB_RUN_ID=123 GITHUB_RUN_ATTEMPT=2
        export GH_TOKEN=test-token
        reset() {
          jq -n '{run: {event: "schedule", head_branch: "main", head_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            created_at: "2026-11-06T22:23:00Z"}, jobs: [{name: "govulncheck (bcrypter)", status: "completed",
            conclusion: "failure", html_url: "https://github.com/w00j00ng/goproj/actions/runs/123/job/bcrypter",
            steps: [{name: "Fail for reachable vulnerabilities", conclusion: "failure"}]}],
            issues: [], comments: [], requests: [], fail_method: "", fail_path: ""}' > "$fixture"
        }
        change() {
          updated=$(jq "$@" "$fixture")
          printf '%s\n' "$updated" > "$fixture"
        }
        check() {
          jq -e "$1" "$fixture" > /dev/null || { printf 'FAIL: %s\n' "$1"; cat "$fixture"; cat "$log"; exit 1; }
        }
        # gh is the API boundary; unexpected requests fail instead of reaching GitHub.
        gh() {
          endpoint=${2#https://api.github.com/repos/w00j00ng/goproj/}
          method=$4
          change --arg method "$method" --arg path "$endpoint" '.requests += [{method: $method, path: $path}]'
          if jq -e --arg method "$method" --arg path "$endpoint" \
            '.fail_method == $method and (.fail_path == "" or .fail_path == $path)' "$fixture" > /dev/null; then
            printf 'HTTP Error 503\n' >&2
            return 1
          fi
          case "$method $endpoint" in
            'GET actions/runs/123') jq .run "$fixture" ;;
            'GET actions/runs/123/attempts/2/jobs')
              jq '[range(0; (.jobs | length); 100) as $i | {jobs: .jobs[$i:$i+100]}]' "$fixture" ;;
            'GET issues?state=open&creator=github-actions%5Bbot%5D')
              jq '[.issues[] | select(.state == "open")] | [range(0; length; 100) as $i | .[$i:$i+100]]' "$fixture" ;;
            'GET issues/'*'/comments')
              number=${endpoint#issues/}; number=${number%/comments}
              jq --argjson number "$number" '[.comments[] | select(.issue_number == $number)] |
                [range(0; length; 100) as $i | .[$i:$i+100]]' "$fixture" ;;
            'POST issues')
              payload=$(cat)
              change --argjson payload "$payload" '.issues += [($payload + {number: (([.issues[].number,41] | max) + 1),
                state: "open", user: {login: "github-actions[bot]"}})]'
              jq '.issues[-1]' "$fixture" ;;
            'PATCH issues/'*)
              number=${endpoint#issues/}; payload=$(cat)
              change --argjson number "$number" --argjson payload "$payload" \
                '(.issues[] | select(.number == $number)) += $payload'
              printf '{}\n' ;;
            'POST issues/'*'/comments')
              number=${endpoint#issues/}; number=${number%/comments}; payload=$(cat)
              change --argjson number "$number" --argjson payload "$payload" \
                '.comments += [($payload + {issue_number: $number, user: {login: "github-actions[bot]"}})]'
              printf '{}\n' ;;
            *) printf 'Unexpected API request: %s %s\n' "$method" "$endpoint" >&2; return 1 ;;
          esac
        }
        report() {
        {{.SECURITY_REPORT | indent 2}}
        }
        invoke() {
          expected=$1
          set +e
          (set -e; report) > "$log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne "$expected" ]; then
            cat "$log"
            cat "$fixture"
            printf 'Expected exit %s; got %s\n' "$expected" "$result"
            exit 1
          fi
        }
        # 요청: main 정기 취약점 발견 + 다른 모듈 오류. 기대: 이슈/멘션 1건, 모듈·커밋·로그와 판정 불가 표시.
        reset
        change '.jobs += [(.jobs[0] | .name = "govulncheck (scrypter)" | .steps[0].conclusion = "skipped")]'
        invoke 0
        check '(.issues | length) == 1 and (.comments | length) == 1 and
          (.issues[0].body | contains("dependency-security-issue:v1") and contains("bcrypter") and
          contains("/job/bcrypter") and contains("aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa") and contains("scrypter")) and
          (.comments[0].body | contains("@w00j00ng") and contains("2026-11-07"))'
        echo 'PASS 1: finding creates one issue and one mention'

        # 요청: 같은 날 재실행 후 다음 날 발견. 기대: 동일 이슈 최신화, 날짜별 댓글 1건.
        reset; invoke 0
        change '.jobs[0].name = "govulncheck (helloworld)"'
        invoke 0
        check '(.issues | length) == 1 and (.comments | length) == 1 and
          (.issues[0].body | contains("helloworld") and (contains("govulncheck (bcrypter)") | not) and
          (contains("검사 오류") | not))'
        change '.run.created_at = "2026-11-07T22:23:00Z"'
        invoke 0
        check '(.issues | length) == 1 and (.comments | length) == 2'
        echo 'PASS 2: reuse and daily deduplication'

        # 요청: 기존 이슈 닫은 뒤 발견. 기대: 닫힌 기록 보존, 새 이슈/댓글 생성.
        reset; invoke 0
        change '.issues[0].state = "closed"'
        closed=$(jq -c .issues[0] "$fixture")
        invoke 0
        check "(.issues | length) == 2 and .issues[0] == $closed and .issues[1].number == 43 and
          .issues[1].state == \"open\" and (.comments | length) == 2 and .comments[1].issue_number == 43"
        echo 'PASS 3: closed issue preserved'

        # 요청: 정상·분석 오류·취소. 기대: 이슈/댓글 쓰기 없음.
        for conclusion in success failure cancelled; do
          reset
          change --arg conclusion "$conclusion" '.jobs[0].conclusion = $conclusion | .jobs[0].steps[0].conclusion = "skipped"'
          invoke 0
          check '(.issues | length) == 0 and (.comments | length) == 0 and all(.requests[]; .method == "GET")'
        done
        echo 'PASS 4: clean scans and execution errors excluded'

        # 요청: PR·수동·push·다른 브랜치. 기대: API 호출 없음.
        for event in pull_request workflow_dispatch push; do
          reset
          GITHUB_EVENT_NAME=$event invoke 0
          check '(.requests | length) == 0'
        done
        reset
        GITHUB_REF=refs/heads/feature invoke 0
        check '(.requests | length) == 0'
        echo 'PASS 5: events and branches excluded'

        # 요청: 이슈/당일 댓글이 두 번째 페이지에 존재. 기대: 재사용, 중복 생성 없음.
        reset; invoke 0
        change '.issues = ([range(100) | {number: (100 + .), state: "open", body: "other", user: {login: "github-actions[bot]"}}] + .issues) |
          .comments = ([range(100) | {issue_number: 42, body: "other", user: {login: "github-actions[bot]"}}] + .comments)'
        invoke 0
        check '(.issues | length) == 101 and (.comments | length) == 101'
        echo 'PASS 6: paginated issues and comments'

        # 요청: 환경변수와 실제 실행 정보 불일치. 기대: 이슈/댓글 쓰기 없음.
        for field in event head_branch; do
          reset
          change --arg field "$field" '.run[$field] = "other"'
          invoke 0
          check '(.issues | length) == 0 and (.comments | length) == 0 and all(.requests[]; .method == "GET")'
        done
        echo 'PASS 7: run metadata checked'

        # 요청: 본문 갱신 API 실패. 기대: 작업 실패, 알림 댓글 없음.
        reset; invoke 0
        change '.comments = [] | .fail_method = "PATCH"'
        invoke 1
        check '(.comments | length) == 0'
        grep -q 'HTTP Error 503' "$log"
        if grep -q "$GH_TOKEN" "$log"; then echo 'Token leaked to log'; exit 1; fi
        echo 'PASS 8: update failure prevents notification'

        # 요청: 이슈 생성 후 댓글 실패, 재실행. 기대: 이슈 재사용, 댓글 1건.
        reset
        change '.fail_method = "POST" | .fail_path = "issues/42/comments"'
        invoke 1
        check '(.issues | length) == 1 and (.comments | length) == 0'
        grep -q 'HTTP Error 503' "$log"
        change '.fail_method = ""'
        invoke 0
        check '(.issues | length) == 1 and (.comments | length) == 1'
        echo 'PASS 9: comment failure retry reuses issue'

        # 요청: 검사 종료 0·1·2·3·127. 기대: CI에서 3만 취약점 표시, 로컬에서는 원래 종료값 유지.
        scan() {
        {{.SECURITY_SCAN | indent 2}}
        }
        govulncheck() { return "$scanner_status"; }
        for scanner_status in 0 1 2 3 127; do
          for mode in ci local; do
            : > "$log"
            if [ "$mode" = ci ]; then export GITHUB_OUTPUT="$log"; else unset GITHUB_OUTPUT; fi
            set +e
            (set -e; scan)
            result=$?
            set -e
            expected=$scanner_status
            if [ "$mode" = ci ] && [ "$scanner_status" -eq 3 ]; then
              expected=0
              grep -qx 'vulnerable=true' "$log"
            else
              test ! -s "$log"
            fi
            test "$result" -eq "$expected"
          done
        done
        echo 'PASS 10: scanner classification'
